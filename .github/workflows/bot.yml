name: Bot de vuelos

on:
  schedule:
    - cron: "0 9 * * *"   # todos los días 09:00 UTC (06:00 Argentina)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install "fast-flights<3" "primp==0.14.0" requests typing_extensions
          python -m playwright install --with-deps chromium \
            || python -m playwright install chromium \
            || echo "sin playwright: el modo local de respaldo queda deshabilitado"

      - name: Correr el bot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python bot_vuelos.py

      - name: Guardar historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in historico.csv ofertas_enviadas.csv; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Sin cambios en el historial"
          else
            git commit -m "historial: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
